# GradConnect — one-command local stack for students.
#
#   cp .env.docker.example .env.docker
#   docker compose up --build
#
# Then open http://localhost:8000
# Demo logins: alumni@ / student@ / partner@gradconnect.edu.ph

services:
  app:
    build:
      context: .
      target: app
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    restart: unless-stopped

  queue:
    build:
      context: .
      target: app
    env_file:
      - .env.docker
    environment:
      # The web container owns migrations/seeding; the worker just processes jobs.
      RUN_MIGRATIONS: "false"
    command: php artisan queue:work --tries=3 --timeout=300
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
      app:
        condition: service_started
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    # Bound to loopback so GUI clients (HeidiSQL, DBeaver) can connect
    # without exposing the database to the rest of the network.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: gradconnect
      POSTGRES_USER: gradconnect
      POSTGRES_PASSWORD: secret
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradconnect -d gradconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Local mail catcher: confirmation emails land in the web inbox at :8025.
  mail:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

  # ── Automated tests (only run when asked: `docker compose run --rm ...`) ──
  # No env_file on purpose: these containers never learn the live database's
  # address, so a test run cannot touch it. phpunit.xml forces SQLite too.
  php-tests:
    build:
      context: .
      target: app
    profiles: ["test"]
    entrypoint: ["php", "artisan", "test"]
    environment:
      # A throwaway key for the test run only; it encrypts nothing real.
      APP_KEY: "base64:dGVzdC1vbmx5LWtleS1ub3QtYS1zZWNyZXQtMDEyMzQ="
    volumes:
      # The image leaves out tests/Fixtures; mount the current tests instead.
      - ./tests:/var/www/html/tests:ro

  frontend-tests:
    image: node:22-bookworm-slim
    profiles: ["test"]
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm test"
    volumes:
      - .:/app
      # Keep Linux packages out of the host's node_modules folder.
      - /app/node_modules

volumes:
  db-data:
  storage-data:
