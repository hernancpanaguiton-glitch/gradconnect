# GradConnect — production stack for a VPS. Setup: DEPLOY-HOSTINGER.md.
#
# Every setting comes from the server's .env file (copied from
# .env.production.example), which also points `docker compose` at this
# file, so on the server plain `docker compose up -d --build` works.
#
# Differences from docker-compose.yml: FrankenPHP serves the app on ports
# 80/443 with automatic HTTPS; the database is not reachable from outside;
# no demo accounts and no Mailpit (real email is configured in .env).

name: gradconnect

services:
  app:
    build:
      context: .
      target: production
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - storage-data:/app/storage
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  queue:
    build:
      context: .
      target: production
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    command: php artisan queue:work --tries=3 --timeout=300 --sleep=3
    # The FrankenPHP image's built-in check probes the web server, which
    # this worker does not run; it would report a healthy worker as failing.
    healthcheck:
      disable: true
    volumes:
      - storage-data:/app/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  # UAT only: catches every email in a password-protected web inbox instead
  # of sending it. Turned on by COMPOSE_PROFILES=uat-mail in .env, and
  # reached through the app's web server at MAILPIT_HOST (never directly).
  mail:
    image: axllent/mailpit:v1.33.0
    profiles: ["uat-mail"]
    environment:
      # "user:password". Optional here only so production without this
      # profile still starts; the Caddyfile refuses to show the inbox
      # when it is empty, and Mailpit's own port is never published.
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
      MP_MAX_MESSAGES: 5000
    volumes:
      - mail-data:/data
    command: ["--database", "/data/mailpit.db"]
    restart: unless-stopped

  # Self-hosted embeddings (AI_EMBEDDING_PROVIDER=ollama), so résumé text
  # stays on this server. Turned on by the "ollama" entry in
  # COMPOSE_PROFILES. Reachable only by the app and worker (no ports
  # published). The model downloads once, on first start, into the volume.
  ollama:
    image: ollama/ollama:0.40.15
    profiles: ["ollama"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama serve & pid=$$!; sleep 5; ollama pull "$${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"; wait $$pid
    environment:
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # Keep the small model loaded, so the first résumé is not slow.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  storage-data:
  caddy-data:
  caddy-config:
  mail-data:
  ollama-data:
